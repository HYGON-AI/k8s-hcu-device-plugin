apiVersion: v1
kind: Pod
metadata:
  name: hcu-share-pytorch-demo
spec:
  containers:
    - name: hcu-share-pytorch-demo
      image: harbor.sourcefind.cn:5443/hcu/admin/base/pytorch:2.1.0-ubuntu22.04-dtk24.04.2-py3.10
      securityContext:
        privileged: true
      command: [ "/bin/bash", "-c", "--" ]
      args: [ "sleep infinity & wait" ]
      resources:
        limits:
          # Replace with the spec actually advertised by the node,
          # e.g. hygon.com/hcu-share-<cu>c-<memGiB>g
          hygon.com/hcu-share-4c-16g: 1 # requesting a pre-split vHCU
