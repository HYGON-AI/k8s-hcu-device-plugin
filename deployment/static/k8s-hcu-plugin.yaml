apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: hcu-device-plugin
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: hcu-dp-ds
  template:
    metadata:
      labels:
        name: hcu-dp-ds
    spec:
      tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: hygon.com/hcu
                operator: In
                values:
                - "true"
              - key: hcu-mode
                operator: NotIn
                values:
                - mig
              - key: hcu
                operator: NotIn
                values:
                - "on"
      containers:
      - image: harbor.sourcefind.cn:5443/hcu/admin/base/hcu-device-plugin:v3.0.0
        name: hcu-dp-cntr
        securityContext:
          privileged: true
        env:
          - name: "PULSE"
            value: "30"
          - name: "RESOURCE_REGISTER_STRATEGY"
            value: "mixed"
          - name: "LOG_SEVERITY"
            value: "INFO"
          - name: "LOG_LEVEL"
            value: "2"
          - name: "POLICY"
            value: "0"
          - name: "NODE_NAME"
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
        volumeMounts:
          - name: dp
            mountPath: /var/lib/kubelet/device-plugins
          - name: dev
            mountPath: /dev
          - name: etc-vdev
            mountPath: /etc/vdev
            readOnly: true
          - name: hyhal
            mountPath: /opt/hyhal
            readOnly: true
      volumes:
        - name: dp
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: etc-vdev
          hostPath:
            path: /etc/vdev
            type: DirectoryOrCreate
        - name: dev
          hostPath:
            path: /dev
        - name: hyhal
          hostPath:
            path: /opt/hyhal
